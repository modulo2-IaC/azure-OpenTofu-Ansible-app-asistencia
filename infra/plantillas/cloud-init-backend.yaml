#cloud-config
package_update: true
packages:
  - git
  - curl

write_files:
  - path: /opt/asistencia-backend/package.json
    encoding: b64
    content: ${package_json}
  - path: /etc/asistencia-backend.env
    permissions: "0600"
    content: |
      PORT=3000
      AMBIENTE=${ambiente}
      NODE_ENV=production
      DATABASE_URL=${database_url}
      JWT_SECRET=${jwt_secret}
      CORS_ORIGIN=${cors_origin}
      APP_TIMEZONE=${app_timezone}
      RUN_MIGRATIONS=${run_migrations}
      ADMIN_REGISTRATION_NO=${admin_registration_no}
      ADMIN_PASSWORD=${admin_password}
      ADMIN_FULL_NAME=${admin_full_name}
  - path: /etc/systemd/system/asistencia-backend.service
    content: |
      [Unit]
      Description=Asistencia Backend NestJS
      After=network.target

      [Service]
      WorkingDirectory=/opt/asistencia-backend
      EnvironmentFile=/etc/asistencia-backend.env
      ExecStart=/usr/bin/node dist/main.js
      Restart=always
      User=asistenciaapp

      [Install]
      WantedBy=multi-user.target

runcmd:
  - fallocate -l 1G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
  - curl -fsSL https://deb.nodesource.com/setup_${node_version}.x | bash - && apt-get install -y nodejs
  - git clone -b ${repo_branch} ${repo_url} /tmp/app && cp -a /tmp/app/. /opt/asistencia-backend/ && rm -rf /tmp/app
  - cp /etc/asistencia-backend.env /opt/asistencia-backend/.env
  - cd /opt/asistencia-backend && npm install && npm run build && (npm run migration:run || true) && (npm run seed:admin || true) && (npm run seed:student || true)
  - useradd --system --no-create-home asistenciaapp || true
  - chown -R asistenciaapp:asistenciaapp /opt/asistencia-backend
  - systemctl daemon-reload
  - systemctl enable --now asistencia-backend
