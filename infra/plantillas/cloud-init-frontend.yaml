#cloud-config
package_update: true
packages:
  - git
  - curl
  - nginx

write_files:
  - path: /var/www/asistencia-front/package.json
    encoding: b64
    content: ${package_json}
  - path: /var/www/asistencia-front/index.html
    encoding: b64
    content: ${index_html}
  - path: /etc/asistencia-frontend.env
    permissions: "0600"
    content: |
      AMBIENTE=${ambiente}
      VITE_API_URL=${vite_api_url}
  - path: /etc/nginx/sites-available/default
    content: |
      server {
          listen 80 default_server;
          listen [::]:80 default_server;
          root /var/www/asistencia-front/dist;
          index index.html;
          server_name _;

          location /api/ {
              proxy_pass http://${backend_host}:3000/api/;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection 'upgrade';
              proxy_set_header Host $host;
              proxy_cache_bypass $http_upgrade;
          }

          location / {
              try_files $uri $uri/ /index.html;
          }
      }
  - path: /etc/systemd/system/asistencia-frontend.service
    content: |
      [Unit]
      Description=Asistencia Frontend Nginx
      After=network.target nginx.service
      Wants=nginx.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/bin/systemctl reload nginx
      ExecReload=/usr/bin/systemctl reload nginx

      [Install]
      WantedBy=multi-user.target

runcmd:
  - fallocate -l 1G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
  - curl -fsSL https://deb.nodesource.com/setup_${node_version}.x | bash - && apt-get install -y nodejs
  - git clone -b ${repo_branch} ${repo_url} /tmp/app && cp -a /tmp/app/. /var/www/asistencia-front/ && rm -rf /tmp/app
  - echo "VITE_API_URL=${vite_api_url}" > /var/www/asistencia-front/.env
  - cd /var/www/asistencia-front && npm install && npm run build
  - useradd --system --no-create-home asistenciaapp || true
  - chown -R www-data:www-data /var/www/asistencia-front
  - chmod -R 755 /var/www/asistencia-front/dist
  - systemctl daemon-reload
  - systemctl restart nginx
  - systemctl enable --now nginx
  - systemctl enable --now asistencia-frontend
