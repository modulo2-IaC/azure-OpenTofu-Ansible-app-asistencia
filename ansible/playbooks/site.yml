---
# =============================================================================
# ORQUESTADOR MAESTRO DE ANSIBLE (site.yml)
# Despliega y configura integralmente la App Asistencia (Arquitectura 3-Tier)
# =============================================================================

- name: Validar conectividad de todos los servidores
  hosts: all
  gather_facts: no
  tasks:
    - name: Esperar a que el puerto SSH esté disponible
      ansible.builtin.wait_for_connection:
        timeout: 120

- name: Aprovisionar servidor de Base de Datos (PostgreSQL)
  ansible.builtin.import_playbook: database.yml

- name: Aprovisionar servidor Backend (NestJS + TypeORM)
  ansible.builtin.import_playbook: backend.yml

- name: Aprovisionar servidor Frontend (React/Vite + Nginx)
  ansible.builtin.import_playbook: frontend.yml
