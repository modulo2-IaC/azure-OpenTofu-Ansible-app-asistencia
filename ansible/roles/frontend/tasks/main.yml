---
- name: Instalar servidor web Nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: yes

- name: Crear directorio para la aplicación frontend
  ansible.builtin.file:
    path: "{{ frontend_app_dir }}"
    state: directory
    owner: "{{ web_user }}"
    group: "{{ web_group }}"
    mode: '0755'

- name: Clonar código fuente del repositorio Frontend
  ansible.builtin.git:
    repo: "{{ frontend_repo_url }}"
    version: "{{ frontend_repo_branch }}"
    dest: "{{ frontend_app_dir }}"
    force: yes
  register: git_clone_frontend

- name: Generar archivo de variables de entorno para Frontend
  ansible.builtin.template:
    src: asistencia-frontend.env.j2
    dest: "{{ frontend_env_file }}"
    owner: root
    group: "{{ web_group }}"
    mode: '0640'

- name: Sincronizar archivo .env en directorio frontend
  ansible.builtin.copy:
    src: "{{ frontend_env_file }}"
    dest: "{{ frontend_app_dir }}/.env"
    remote_src: yes
    owner: "{{ web_user }}"
    group: "{{ web_group }}"
    mode: '0600'

- name: Comprobar si node_modules existe en el frontend
  ansible.builtin.stat:
    path: "{{ frontend_app_dir }}/node_modules"
  register: frontend_node_modules

- name: Instalar dependencias npm del Frontend
  ansible.builtin.command: npm install
  args:
    chdir: "{{ frontend_app_dir }}"
  when: (git_clone_frontend.changed or not frontend_node_modules.stat.exists) and not ansible_check_mode

- name: Comprobar si dist compilado existe en el frontend
  ansible.builtin.stat:
    path: "{{ frontend_app_dir }}/dist/index.html"
  register: frontend_dist

- name: Compilar aplicación web estática con Vite (npm run build)
  ansible.builtin.command: npm run build
  args:
    chdir: "{{ frontend_app_dir }}"
  when: (git_clone_frontend.changed or not frontend_dist.stat.exists) and not ansible_check_mode

- name: Ajustar permisos del directorio web y distribución compilada
  ansible.builtin.file:
    path: "{{ frontend_app_dir }}"
    owner: "{{ web_user }}"
    group: "{{ web_group }}"
    recurse: yes

- name: Desplegar configuración VirtualHost Nginx
  ansible.builtin.template:
    src: nginx-asistencia.conf.j2
    dest: /etc/nginx/sites-available/asistencia-frontend
    owner: root
    group: root
    mode: '0644'
  register: nginx_conf

- name: Deshabilitar VirtualHost default de Nginx si existe
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Habilitar VirtualHost asistencia-frontend mediante enlace simbólico
  ansible.builtin.file:
    src: /etc/nginx/sites-available/asistencia-frontend
    dest: /etc/nginx/sites-enabled/asistencia-frontend
    state: link

- name: Validar configuración de sintaxis Nginx
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Reiniciar y asegurar inicio automático de Nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: yes
    state: restarted
  when: not ansible_check_mode

