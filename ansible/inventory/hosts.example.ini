# =============================================================================
# INVENTARIO DE ANSIBLE (Ejemplo)
# Autenticación exclusiva por clave SSH (sin contraseñas)
# =============================================================================

[backend]
vm-backend ansible_host=20.100.1.10 ansible_user=azureuser ansible_ssh_private_key_file=~/.ssh/asistencia_vm

[frontend]
vm-frontend ansible_host=20.100.1.20 ansible_user=azureuser ansible_ssh_private_key_file=~/.ssh/asistencia_vm

[app:children]
backend
frontend

[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes'
