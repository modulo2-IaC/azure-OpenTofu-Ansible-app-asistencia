---
# Variables de aprovisionamiento para Backend NestJS
backend_port: 3000
app_user: "asistenciaapp"
app_group: "asistenciaapp"
backend_app_dir: "/opt/app"
backend_env_file: "/etc/asistencia-backend.env"

# Repositorio Git
backend_repo_url: "https://github.com/modulo2-IaC/app-asistencia-backend.git"
backend_repo_branch: "dev"

# Base de datos y autenticación
# database_url y jwt_secret son inyectados dinámicamente desde inventory/hosts.ini (generado por OpenTofu)
cors_origin: "*"

# Configuración inicial de la aplicación
run_migrations: true
admin_registration_no: "123456789"
admin_initial_password: "123456789"
admin_full_name: "ADMIN"

# Nombre del servicio systemd
service_name: "asistencia-backend"

